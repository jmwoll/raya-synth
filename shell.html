<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>raya</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
    canvas { display: block; outline: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = { canvas: document.getElementById('canvas') };

    // TAPE: pick an audio file; raya.c polls rayaTakePicked() for its path.
    function rayaPickFile() {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.wav,.mp3,.ogg,.flac,.qoa,audio/*';
      input.onchange = function () {
        var f = input.files[0];
        if (!f) return;
        f.arrayBuffer().then(function (buf) {
          try { FS.mkdir('/tmp/raya-in'); } catch (e) {}
          var path = '/tmp/raya-in/' + f.name.replace(/[^A-Za-z0-9._-]/g, '_');
          FS.writeFile(path, new Uint8Array(buf));
          Module.rayaPicked = path;
        });
      };
      input.click();
    }
    function rayaTakePicked() {
      var p = Module.rayaPicked || '';
      Module.rayaPicked = '';
      return p;
    }

    // TAPE: where a file is being dropped (no mouse events fire during a drag).
    Module.canvas.addEventListener('dragover', function (e) {
      var c = Module.canvas, r = c.getBoundingClientRect();   // same mapping GLFW uses for the mouse
      Module.rayaDropX = Math.round((e.clientX - r.left) * c.width / r.width);
      Module.rayaDropY = Math.round((e.clientY - r.top) * c.height / r.height);
    });

    function rayaSaveBlob(blob, name) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
    }

    // Exported audio: hand a file from the in-memory file system to the browser.
    function rayaDownload(path) {
      var name = path.split('/').pop();
      rayaSaveBlob(new Blob([FS.readFile(path)], { type: /\.mp3$/.test(name) ? 'audio/mpeg' : 'audio/wav' }), name);
      FS.unlink(path);
    }

    // Video: the canvas as drawn plus the synth's own Web Audio output,
    // encoded by the browser (MP4 where supported, WebM otherwise).
    var rayaVideo = null;
    function rayaVideoStart() {
      if (!window.MediaRecorder || !Module.canvas.captureStream) return 0;
      var dev = ((window.miniaudio && miniaudio.devices) || []).find(function (d) { return d && d.scriptNode; });
      var tracks = Module.canvas.captureStream(30).getVideoTracks(), dest = null;
      if (dev) {
        dest = dev.webaudio.createMediaStreamDestination();
        dev.scriptNode.connect(dest);
        tracks = tracks.concat(dest.stream.getAudioTracks());
      }
      var type = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus',
                  'video/webm;codecs=vp8,opus', 'video/webm'].find(function (t) { return MediaRecorder.isTypeSupported(t); });
      var rec, chunks = [];
      try {
        rec = new MediaRecorder(new MediaStream(tracks), type ? { mimeType: type, videoBitsPerSecond: 8000000 } : undefined);
      } catch (e) { console.error('raya: cannot record video', e); return 0; }
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        if (dest) { try { dev.scriptNode.disconnect(dest); } catch (e) {} }
        tracks.forEach(function (t) { t.stop(); });
        var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
        var stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
        rayaSaveBlob(new Blob(chunks, { type: rec.mimeType }), 'raya-video-' + stamp + (/mp4/.test(rec.mimeType) ? '.mp4' : '.webm'));
      };
      rec.start(1000);
      rayaVideo = rec;
      return 1;
    }
    function rayaVideoStop() {
      if (rayaVideo) { rayaVideo.stop(); rayaVideo = null; }
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
